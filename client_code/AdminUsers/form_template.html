<anvil-form layout="Minimal_Theme_4.Layouts.BaseLayout">
  <anvil-block slot="title">
    <anvil-component type="Label" name="page_title" prop:role="h1" prop:text="Пользователи и роли"></anvil-component>
  </anvil-block>
  <anvil-block slot="content">
    <div class="admin-users-view">
      <div class="admin-users-heading">
        <anvil-component type="Label" name="users_eyebrow" prop:role="eyebrow" prop:text="УПРАВЛЕНИЕ ДОСТУПОМ · АДМИНИСТРАТОР"></anvil-component>
        <anvil-component type="Label" name="users_intro" prop:role="lede" prop:text="Учётные записи, разрешения и журнал действий. Пароли хранятся только в виде хеша."></anvil-component>
      </div>
      <div class="admin-users-grid">
        <anvil-component type="ColumnPanel" name="user_list_panel" prop:role="admin-panel">
          <anvil-component type="Label" name="user_list_heading" prop:role="section-heading" prop:text="Учетные записи"></anvil-component>
          <div class="user-search-row">
            <anvil-component type="TextBox" name="search_box" prop:placeholder="Поиск по электронной почте"></anvil-component>
            <anvil-component type="Button" name="search_button" prop:text="Найти" prop:role="secondary-button"></anvil-component>
          </div>
          <anvil-component type="DropDown" name="user_dropdown"></anvil-component>
          <anvil-component type="Label" name="user_status" prop:role="status-message" prop:text=""></anvil-component>
          <div class="pagination-actions">
            <anvil-component type="Button" name="previous_button" prop:text="← Назад" prop:role="secondary-button" prop:visible="false"></anvil-component>
            <anvil-component type="Button" name="next_button" prop:text="Следующие" prop:role="secondary-button" prop:visible="false"></anvil-component>
          </div>
          <div class="admin-divider"></div>
          <anvil-component type="Label" name="activity_heading" prop:role="section-heading" prop:text="Активность пользователя"></anvil-component>
          <anvil-component type="Button" name="activity_button" prop:text="Загрузить активность" prop:role="secondary-button"></anvil-component>
          <anvil-component type="TextArea" name="activity_box" prop:enabled="false" prop:placeholder="Последние события"></anvil-component>
        </anvil-component>

        <div class="admin-users-edit-stack">
          <anvil-component type="ColumnPanel" name="role_manager_panel" prop:role="admin-panel">
            <anvil-component type="Label" name="role_manager_heading" prop:role="section-heading" prop:text="Роли и разрешения"></anvil-component>
            <anvil-component type="Label" name="role_manager_intro" prop:role="status-message" prop:text="Роли задают серверные права доступа. ADMIN защищён, пользовательскую роль можно удалить только после перевода всех её участников."></anvil-component>
            <div class="admin-role-toolbar">
              <anvil-component type="DropDown" name="managed_role_dropdown"></anvil-component>
              <anvil-component type="Button" name="new_role_button" prop:text="Новая роль" prop:role="secondary-button"></anvil-component>
            </div>
            <anvil-component type="Label" name="role_editor_heading" prop:role="eyebrow" prop:text="Разрешения роли"></anvil-component>
            <div class="admin-user-fields">
              <div class="calculator-field">
                <anvil-component type="Label" name="managed_role_code_label" prop:text="Системный код · латиница"></anvil-component>
                <anvil-component type="TextBox" name="managed_role_code_box" prop:placeholder="catalog_editor"></anvil-component>
              </div>
              <div class="calculator-field">
                <anvil-component type="Label" name="managed_role_title_label" prop:text="Название роли"></anvil-component>
                <anvil-component type="TextBox" name="managed_role_title_box" prop:placeholder="Редактор каталога"></anvil-component>
              </div>
            </div>
            <anvil-component type="Label" name="managed_role_permissions_label" prop:text="Права · по одному коду на строку"></anvil-component>
            <anvil-component type="TextArea" name="managed_role_permissions_box" prop:placeholder="catalog.manage"></anvil-component>
            <anvil-component type="Label" name="managed_role_usage" prop:role="status-message" prop:text=""></anvil-component>
            <div class="calculator-actions">
              <anvil-component type="Button" name="save_role_button" prop:text="Сохранить роль" prop:role="primary-action"></anvil-component>
              <anvil-component type="Button" name="delete_role_button" prop:text="Удалить роль" prop:role="danger-action"></anvil-component>
            </div>
            <anvil-component type="Label" name="role_editor_status" prop:role="status-message" prop:text=""></anvil-component>
          </anvil-component>

          <anvil-component type="ColumnPanel" name="create_user_panel" prop:role="admin-panel">
            <anvil-component type="Label" name="create_user_heading" prop:role="section-heading" prop:text="Создать учётную запись"></anvil-component>
            <div class="admin-user-fields">
              <div class="calculator-field">
                <anvil-component type="Label" name="create_email_label" prop:text="Электронная почта для входа"></anvil-component>
                <anvil-component type="TextBox" name="create_email_box" prop:placeholder="user@example.ru"></anvil-component>
              </div>
              <div class="calculator-field">
                <anvil-component type="Label" name="create_role_label" prop:text="Роль"></anvil-component>
                <anvil-component type="DropDown" name="create_role_dropdown"></anvil-component>
              </div>
            </div>
            <anvil-component type="Label" name="create_password_help" prop:role="status-message" prop:text="Система создаст безопасный пароль и активирует аккаунт без подтверждения электронной почты."></anvil-component>
            <anvil-component type="Label" name="create_permissions_label" prop:text="Дополнительные разрешения · по одному коду на строку"></anvil-component>
            <anvil-component type="TextArea" name="create_permissions_box" prop:placeholder="catalog.manage"></anvil-component>
            <anvil-component type="Button" name="create_user_button" prop:text="Создать пользователя" prop:role="primary-action"></anvil-component>
            <anvil-component type="Label" name="created_password_label" prop:text="Начальный пароль · сохраните сейчас"></anvil-component>
            <anvil-component type="TextBox" name="created_password_box" prop:enabled="false" prop:placeholder="Появится один раз после создания"></anvil-component>
          </anvil-component>

          <anvil-component type="ColumnPanel" name="edit_user_panel" prop:role="admin-panel">
            <anvil-component type="Label" name="edit_user_heading" prop:role="section-heading" prop:text="Роль и доступ выбранного пользователя"></anvil-component>
            <div class="admin-user-fields">
              <div class="calculator-field">
                <anvil-component type="Label" name="role_label" prop:text="Роль"></anvil-component>
                <anvil-component type="DropDown" name="role_dropdown"></anvil-component>
              </div>
              <div class="calculator-field">
                <anvil-component type="Label" name="enabled_label" prop:text="Состояние аккаунта"></anvil-component>
                <anvil-component type="DropDown" name="enabled_dropdown"></anvil-component>
              </div>
            </div>
            <anvil-component type="Label" name="permissions_label" prop:text="Персональные разрешения · по одному коду на строку"></anvil-component>
            <anvil-component type="TextArea" name="permissions_box" prop:placeholder="projects.manage"></anvil-component>
            <div class="calculator-actions">
              <anvil-component type="Button" name="save_user_button" prop:text="Сохранить роль и права" prop:role="primary-action"></anvil-component>
              <anvil-component type="Button" name="reset_access_button" prop:text="Сбросить доступ" prop:role="secondary-button"></anvil-component>
            </div>
            <anvil-component type="CheckBox" name="delete_confirmation_checkbox" prop:text="Подтверждаю удаление выбранного аккаунта"></anvil-component>
            <anvil-component type="Button" name="delete_button" prop:text="Удалить пользователя" prop:role="danger-action"></anvil-component>
            <anvil-component type="Label" name="admin_users_message" prop:role="status-message" prop:text=""></anvil-component>
          </anvil-component>
        </div>
      </div>
    </div>
  </anvil-block>
</anvil-form>
