<anvil-form layout="Minimal_Theme_4.Layouts.BaseLayout">
  <anvil-block slot="actions">
    <anvil-component type="Button" name="new_project_button" prop:text="Начать инженерный проект" prop:role="primary-action"></anvil-component>
    <anvil-component type="Button" name="catalog_button" prop:text="Каталог" prop:role="secondary-button"></anvil-component>
    <anvil-component type="Button" name="calculations_button" prop:text="Расчёты" prop:role="secondary-button"></anvil-component>
    <anvil-component type="Button" name="compatibility_button" prop:text="Совместимость" prop:role="secondary-button"></anvil-component>
    <anvil-component type="Button" name="home_button" prop:text="В панель" prop:role="secondary-button"></anvil-component>
  </anvil-block>
  <anvil-block slot="content">
    <div class="projects-view">
      <anvil-component type="ColumnPanel" name="project_list_panel" prop:role="card">
        <anvil-component type="Label" name="projects_intro" prop:role="lede" prop:text="Начните с инженерного брифа: объект → помещения → инженерный профиль → расчёт → подбор → проект → смета → монтаж → сервис. Данные вводятся один раз и используются всей системой."></anvil-component>
        <anvil-component type="TextBox" name="project_search_box" prop:placeholder="Название или код проекта"></anvil-component>
        <anvil-component type="Button" name="project_search_button" prop:text="Найти" prop:role="secondary-button"></anvil-component>
        <anvil-component type="Label" name="projects_message" prop:role="status-message" prop:text=""></anvil-component>
        <anvil-component type="RepeatingPanel" name="project_rows" prop:item_template="Minimal_Theme_4.Projects.ProjectItem"></anvil-component>
        <anvil-component type="Button" name="previous_button" prop:text="Назад" prop:role="secondary-button" prop:visible="false"></anvil-component>
        <anvil-component type="Button" name="next_button" prop:text="Следующие проекты" prop:role="secondary-button" prop:visible="false"></anvil-component>
      </anvil-component>
      <anvil-component type="ColumnPanel" name="project_editor" prop:role="card" prop:visible="false">
        <anvil-component type="Label" name="project_code_label" prop:role="eyebrow" prop:text=""></anvil-component>
        <anvil-component type="Label" name="project_editor_heading" prop:role="section-heading" prop:text="01 · Инженерный бриф объекта"></anvil-component>
        <anvil-component type="TextBox" name="project_title_box" prop:placeholder="Название проекта"></anvil-component>
        <anvil-component type="TextBox" name="object_name_box" prop:placeholder="Название объекта"></anvil-component>
        <anvil-component type="DropDown" name="project_type_dropdown"></anvil-component>
        <anvil-component type="DropDown" name="engineering_profile_dropdown"></anvil-component>
        <anvil-component type="DropDown" name="engineering_goal_dropdown"></anvil-component>
        <anvil-component type="DropDown" name="project_priority_dropdown"></anvil-component>
        <anvil-component type="Label" name="engineering_profile_hint" prop:role="status-message" prop:text="Профиль определяет основной инженерный маршрут. Цель и приоритет формируют инженерный бриф, а независимые расчётные модули остаются отдельными."></anvil-component>
        <anvil-component type="TextBox" name="object_address_box" prop:placeholder="Адрес объекта"></anvil-component>
        <anvil-component type="TextArea" name="object_constraints_box" prop:placeholder="Ограничения объекта: высота, шум, сроки, бюджет, архитектура, доступ и т. п."></anvil-component>
        <anvil-component type="TextArea" name="object_parameters_box" prop:placeholder="Дополнительные параметры объекта в JSON, до 4 КБ"></anvil-component>
        <anvil-component type="DropDown" name="project_status_dropdown"></anvil-component>
        <anvil-component type="Button" name="save_project_button" prop:text="Создать и открыть проект" prop:role="primary-action"></anvil-component>
        <anvil-component type="Button" name="project_calculation_button" prop:text="Расчёты проекта" prop:role="secondary-button" prop:visible="false"></anvil-component>
        <anvil-component type="Button" name="engineering_control_button" prop:text="Engineering Control Room" prop:role="primary-action" prop:visible="false"></anvil-component>
        <anvil-component type="Button" name="cancel_project_button" prop:text="Закрыть карточку" prop:role="secondary-button"></anvil-component>
        <anvil-component type="Label" name="project_message" prop:role="status-message" prop:text=""></anvil-component>
      </anvil-component>
<anvil-component type="ColumnPanel" name="engineering_lifecycle_panel" prop:role="card" prop:visible="false">
        <anvil-component type="Label" name="engineering_stage_eyebrow" prop:role="eyebrow" prop:text="ИНЖЕНЕРНЫЙ КОНТУР"></anvil-component>
        <anvil-component type="Label" name="engineering_stage_label" prop:role="section-heading" prop:text="—"></anvil-component>
        <anvil-component type="Label" name="engineering_stage_description" prop:role="status-message" prop:text=""></anvil-component>
        <anvil-component type="Label" name="engineering_next_action_label" prop:role="lede" prop:text=""></anvil-component>
        <anvil-component type="Label" name="engineering_risk_label" prop:role="status-message" prop:text=""></anvil-component>
        <anvil-component type="Label" name="engineering_score_label" prop:role="role-badge" prop:text="Engineering Score: —"></anvil-component>
        <anvil-component type="Label" name="engineering_lifecycle_label" prop:role="lede" prop:text=""></anvil-component>
      </anvil-component>
      <anvil-component type="ColumnPanel" name="rooms_panel" prop:role="card" prop:visible="false">
        <anvil-component type="Label" name="rooms_heading" prop:role="section-heading" prop:text="Помещения объекта"></anvil-component>
        <anvil-component type="Button" name="add_room_button" prop:text="Добавить помещение" prop:role="secondary-button"></anvil-component>
        <anvil-component type="RepeatingPanel" name="room_rows" prop:item_template="Minimal_Theme_4.Projects.RoomItem"></anvil-component>
        <anvil-component type="Label" name="room_message" prop:role="status-message" prop:text=""></anvil-component>
      </anvil-component>
      <anvil-component type="ColumnPanel" name="systems_panel" prop:role="card" prop:visible="false">
        <anvil-component type="Label" name="systems_heading" prop:role="section-heading" prop:text="Системы объекта"></anvil-component>
        <anvil-component type="TextBox" name="system_title_box" prop:placeholder="Название HVAC-системы"></anvil-component>
        <anvil-component type="DropDown" name="system_type_dropdown"></anvil-component>
        <anvil-component type="Button" name="create_system_button" prop:text="Добавить систему" prop:role="secondary-button"></anvil-component>
        <anvil-component type="RepeatingPanel" name="system_rows" prop:item_template="Minimal_Theme_4.Projects.SystemItem"></anvil-component>
        <anvil-component type="Label" name="system_message" prop:role="status-message" prop:text=""></anvil-component>
      </anvil-component>
      <anvil-component type="ColumnPanel" name="room_editor" prop:role="card" prop:visible="false">
        <anvil-component type="Label" name="room_editor_heading" prop:role="section-heading" prop:text="Параметры помещения"></anvil-component>
        <anvil-component type="TextBox" name="room_name_box" prop:placeholder="Название помещения"></anvil-component>
        <anvil-component type="TextBox" name="room_area_box" prop:placeholder="Площадь, м²"></anvil-component>
        <anvil-component type="TextBox" name="room_height_box" prop:placeholder="Высота, м"></anvil-component>
        <anvil-component type="TextArea" name="room_parameters_box" prop:placeholder="Параметры помещения в JSON, до 4 КБ"></anvil-component>
        <anvil-component type="Button" name="save_room_button" prop:text="Сохранить помещение" prop:role="primary-action"></anvil-component>
        <anvil-component type="Button" name="cancel_room_button" prop:text="Отмена" prop:role="secondary-button"></anvil-component>
      </anvil-component>
    </div>
  </anvil-block>
  <anvil-block slot="title">
    <anvil-component type="Label" name="page_title" prop:role="h1" prop:text="Проекты HVAC"></anvil-component>
  </anvil-block>
</anvil-form>      <anvil-component type="ColumnPanel" name="engineering_decision_panel" prop:role="card" prop:visible="false">
        <anvil-component type="Button" name="engineering_decision_load_button" prop:text="Запустить Smart Selection" prop:role="primary-action"></anvil-component>
        <anvil-component type="Label" name="engineering_decision_heading" prop:role="section-heading" prop:text="SMART SELECTION · Инженерное решение"></anvil-component>
        <anvil-component type="Label" name="engineering_decision_message" prop:role="status-message" prop:text="Подбор запускается из контекста текущей системы."></anvil-component>
        <anvil-component type="Label" name="engineering_decision_summary" prop:role="lede" prop:text=""></anvil-component>
        <anvil-component type="RepeatingPanel" name="engineering_decision_rows" prop:item_template="Minimal_Theme_4.Projects.EngineeringDecisionItem"></anvil-component>
      </anvil-component>
      <anvil-component type="ColumnPanel" name="engineering_action_panel" prop:role="card" prop:visible="false">
        <anvil-component type="Label" name="engineering_action_heading" prop:role="section-heading" prop:text="NEXT ACTIONS · Инженерный маршрут"></anvil-component>
        <anvil-component type="Label" name="engineering_action_message" prop:role="status-message" prop:text=""></anvil-component>
        <anvil-component type="RepeatingPanel" name="engineering_action_rows" prop:item_template="Minimal_Theme_4.Projects.EngineeringActionItem"></anvil-component>
      </anvil-component>
