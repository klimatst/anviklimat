<anvil-form container="ColumnPanel" prop:role="card">
  <anvil-component type="Label" name="action_priority" prop:role="eyebrow" bind:text="self.item['priority']"></anvil-component>
  <anvil-component type="Label" name="action_title" prop:role="section-heading" bind:text="self.item['title']"></anvil-component>
  <anvil-component type="Label" name="action_description" prop:role="status-message" bind:text="self.item['description']"></anvil-component>
</anvil-form>
