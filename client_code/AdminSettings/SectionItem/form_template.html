<anvil-form container="ColumnPanel" prop:role="settings-section-item">
  <anvil-component type="Button" name="select_button" prop:role="settings-section-link" bind:text="self.item['title']"></anvil-component>
  <anvil-component type="Label" name="section_description" prop:role="settings-section-description" bind:text="self.item['group']"></anvil-component>
  <anvil-component type="Label" name="section_status" prop:role="settings-section-status" prop:text=""></anvil-component>
</anvil-form>
