<anvil-form container="ColumnPanel" prop:role="card">
  <anvil-component type="Label" name="key_label" prop:role="section-heading" bind:text="self.item['key']"></anvil-component>
  <anvil-component type="Label" name="value_label" bind:text="self.item['value']"></anvil-component>
  <anvil-component type="Label" name="unit_label" bind:text="self.item['unit']"></anvil-component>
  <anvil-component type="Label" name="source_label" bind:text="self.item['source']"></anvil-component>
</anvil-form>
