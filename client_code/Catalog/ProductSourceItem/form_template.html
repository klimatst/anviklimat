<anvil-form container="ColumnPanel" prop:role="card">
  <anvil-component type="Label" name="publisher_label" prop:role="section-heading" bind:text="self.item['publisher']"></anvil-component>
  <anvil-component type="Label" name="url_label" bind:text="self.item['url']"></anvil-component>
  <anvil-component type="Label" name="version_label" bind:text="self.item['version']"></anvil-component>
  <anvil-component type="Label" name="checked_at_label" bind:text="self.item['checked_at']"></anvil-component>
</anvil-form>
