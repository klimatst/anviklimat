<anvil-form layout="Minimal_Theme_4.Layouts.BaseLayout">
  <anvil-block slot="actions">
    <anvil-component type="Button" name="new_product_button" prop:text="Добавить товар" prop:role="primary-action" prop:visible="false"></anvil-component>
    <anvil-component type="Button" name="import_button" prop:text="Импортировать" prop:role="secondary-button" prop:visible="false"></anvil-component>
    <anvil-component type="Button" name="manage_categories_button" prop:text="Категории" prop:role="secondary-button" prop:visible="false"></anvil-component>
    <anvil-component type="Button" name="manage_series_button" prop:text="Серии" prop:role="secondary-button" prop:visible="false"></anvil-component>
    <anvil-component type="Button" name="add_category_button" prop:text="Новая категория" prop:role="secondary-button" prop:visible="false"></anvil-component>
    <anvil-component type="DropDown" name="export_format_dropdown" prop:role="catalog-export-format" prop:visible="false"></anvil-component>
    <anvil-component type="Button" name="export_filter_button" prop:text="Экспортировать выборку" prop:role="secondary-button" prop:visible="false"></anvil-component>
    <anvil-component type="Button" name="export_selected_button" prop:text="Экспорт выбранных" prop:role="secondary-button" prop:visible="false"></anvil-component>
    <anvil-component type="Button" name="home_button" prop:text="На главную" prop:role="secondary-button"></anvil-component>
  </anvil-block>
  <anvil-block slot="title">
    <div class="catalog-page-title">
      <anvil-component type="RepeatingPanel" name="breadcrumb_rows" prop:role="catalog-breadcrumbs" prop:item_template="Minimal_Theme_4.Catalog.BreadcrumbItem"></anvil-component>
      <anvil-component type="Label" name="page_title" prop:role="h1" prop:text="Каталог оборудования"></anvil-component>
    </div>
  </anvil-block>
  <anvil-block slot="content">
    <div anvil:name="catalog_view" class="catalog-view catalog-storefront catalog-reference-layout">
      <div class="catalog-navigation-column">
        <anvil-component type="Label" name="catalog_navigation_heading" prop:role="section-heading" prop:text="Каталог оборудования"></anvil-component>
        <anvil-component type="RepeatingPanel" name="category_tree" prop:role="catalog-tree" prop:item_template="Minimal_Theme_4.Catalog.CategoryItem"></anvil-component>
      </div>
      <div class="catalog-main">
        <div class="catalog-page-controls">
          <anvil-component type="Button" name="catalog_navigation_toggle_button" prop:text="Все категории" prop:role="catalog-navigation-toggle"></anvil-component>
        </div>
        <div class="catalog-category-heading">
          <anvil-component type="Label" name="category_description" prop:role="catalog-category-description" prop:text=""></anvil-component>
        </div>
        <anvil-component type="RepeatingPanel" name="category_tiles" prop:role="catalog-category-grid" prop:item_template="Minimal_Theme_4.Catalog.CategoryCard"></anvil-component>
        <div anvil:name="catalog_series_navigation" class="catalog-series-navigation">
          <anvil-component type="Label" name="series_navigation_heading" prop:role="section-heading" prop:text="Быстрый переход к серии"></anvil-component>
          <anvil-component type="RepeatingPanel" name="series_quick_links" prop:role="catalog-series-quick-links" prop:item_template="Minimal_Theme_4.Catalog.SeriesQuickLink"></anvil-component>
        </div>
        <anvil-component type="ColumnPanel" name="catalog_panel" prop:role="catalog-results-panel">
          <div class="catalog-toolbar catalog-toolbar--reference">
            <anvil-component type="TextBox" name="search_box" prop:role="catalog-search" prop:placeholder="Модель, артикул, серия или категория"></anvil-component>
            <anvil-component type="DropDown" name="category_filter" prop:role="catalog-filter"></anvil-component>
            <anvil-component type="DropDown" name="series_filter" prop:role="catalog-filter"></anvil-component>
            <anvil-component type="TextBox" name="minimum_price_box" prop:role="catalog-filter" prop:placeholder="Цена от"></anvil-component>
            <anvil-component type="TextBox" name="maximum_price_box" prop:role="catalog-filter" prop:placeholder="Цена до"></anvil-component>
            <anvil-component type="DropDown" name="sort_filter" prop:role="catalog-filter"></anvil-component>
            <anvil-component type="CheckBox" name="available_filter" prop:text="Только в наличии" prop:role="catalog-availability-filter"></anvil-component>
            <anvil-component type="DropDown" name="status_filter" prop:role="catalog-filter" prop:visible="false"></anvil-component>
            <anvil-component type="Button" name="search_button" prop:text="Показать модели" prop:role="primary-action"></anvil-component>
          </div>
          <anvil-component type="Label" name="catalog_message" prop:role="status-message" prop:text=""></anvil-component>
          <anvil-component type="RepeatingPanel" name="product_series_rows" prop:role="catalog-series-list" prop:item_template="Minimal_Theme_4.Catalog.SeriesItem"></anvil-component>
          <div class="catalog-pagination">
            <anvil-component type="Button" name="previous_button" prop:text="Назад" prop:role="secondary-button" prop:visible="false"></anvil-component>
            <anvil-component type="Button" name="next_button" prop:text="Следующие модели" prop:role="secondary-button" prop:visible="false"></anvil-component>
          </div>
          <anvil-component type="Label" name="selection_count" prop:role="status-message" prop:text="Выбрано моделей: 0 из 100"></anvil-component>
          <anvil-component type="Button" name="clear_selection_button" prop:text="Снять выделение" prop:role="secondary-button" prop:visible="false"></anvil-component>
          <anvil-component type="ColumnPanel" name="bulk_panel" prop:role="catalog-bulk-panel" prop:visible="false">
            <anvil-component type="Label" name="bulk_heading" prop:role="section-heading" prop:text="Массовое изменение каталога"></anvil-component>
            <anvil-component type="DropDown" name="bulk_field_dropdown"></anvil-component>
            <anvil-component type="DropDown" name="bulk_mode_dropdown"></anvil-component>
            <anvil-component type="DropDown" name="bulk_choice_dropdown" prop:visible="false"></anvil-component>
            <anvil-component type="TextBox" name="bulk_value_box" prop:placeholder="Цена или изменение в процентах"></anvil-component>
            <anvil-component type="Button" name="bulk_apply_button" prop:text="Применить к выбранным" prop:role="primary-action"></anvil-component>
            <anvil-component type="Label" name="bulk_message" prop:role="status-message" prop:text=""></anvil-component>
          </anvil-component>
        </anvil-component>
        <anvil-component type="ColumnPanel" name="new_category_panel" prop:role="card" prop:visible="false">
          <anvil-component type="Label" name="new_category_title" prop:role="section-heading" prop:text="Новая категория"></anvil-component>
          <anvil-component type="TextBox" name="new_category_name_box" prop:placeholder="Название категории"></anvil-component>
          <anvil-component type="DropDown" name="new_category_parent"></anvil-component>
          <anvil-component type="Button" name="save_category_button" prop:text="Сохранить категорию" prop:role="primary-action"></anvil-component>
          <anvil-component type="Label" name="category_message" prop:role="status-message" prop:text=""></anvil-component>
        </anvil-component>
      </div>
    </div>
    <anvil-component type="ColumnPanel" name="product_detail_overlay" prop:role="product-detail-overlay" prop:visible="false">
      <anvil-component type="Minimal_Theme_4.Catalog.ProductDetails" name="product_detail_form"></anvil-component>
    </anvil-component>
  </anvil-block>
</anvil-form>
