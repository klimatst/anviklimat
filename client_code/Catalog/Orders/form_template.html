<anvil-form layout="Minimal_Theme_4.Layouts.BaseLayout">
  <anvil-block slot="actions">
    <anvil-component type="Button" name="refresh_button" prop:text="Обновить" prop:role="secondary-button"></anvil-component>
    <anvil-component type="Button" name="home_button" prop:text="В панель" prop:role="secondary-button"></anvil-component>
  </anvil-block>
  <anvil-block slot="content">
    <div class="catalog-orders-view">
      <anvil-component type="Label" name="orders_intro" prop:role="lede" prop:text="Заказы, отправленные из карточек оборудования. Контактные данные доступны только сотрудникам с правом управления каталогом."></anvil-component>
      <div class="catalog-toolbar">
        <anvil-component type="TextBox" name="search_box" prop:role="catalog-search" prop:placeholder="Товар, модель, артикул, имя, телефон или email"></anvil-component>
        <anvil-component type="DropDown" name="status_filter" prop:role="catalog-filter"></anvil-component>
        <anvil-component type="Button" name="search_button" prop:text="Найти" prop:role="primary-action"></anvil-component>
      </div>
      <anvil-component type="Label" name="order_message" prop:role="status-message" prop:text=""></anvil-component>
      <anvil-component type="ColumnPanel" name="orders_panel" prop:role="catalog-orders-list">
        <anvil-component type="RepeatingPanel" name="order_rows" prop:item_template="Minimal_Theme_4.Catalog.Orders.OrderItem"></anvil-component>
      </anvil-component>
    </div>
  </anvil-block>
  <anvil-block slot="title">
    <anvil-component type="Label" name="page_title" prop:role="h1" prop:text="Заявки каталога"></anvil-component>
  </anvil-block>
</anvil-form>
