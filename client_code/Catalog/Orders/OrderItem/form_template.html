<anvil-form container="ColumnPanel" prop:role="catalog-order-card">
  <div class="catalog-order-card__header">
    <anvil-component type="Label" name="product_heading" prop:role="section-heading" prop:text=""></anvil-component>
    <anvil-component type="Label" name="created_label" prop:role="status-message" prop:text=""></anvil-component>
  </div>
  <anvil-component type="Label" name="sku_label" prop:text=""></anvil-component>
  <anvil-component type="Label" name="catalog_path_label" prop:text=""></anvil-component>
  <anvil-component type="Label" name="quantity_label" prop:text=""></anvil-component>
  <anvil-component type="Label" name="price_label" prop:text=""></anvil-component>
  <anvil-component type="Label" name="total_label" prop:role="section-heading" prop:text=""></anvil-component>
  <anvil-component type="Label" name="customer_label" prop:role="section-heading" prop:text=""></anvil-component>
  <anvil-component type="Label" name="contact_label" prop:text=""></anvil-component>
  <anvil-component type="Label" name="comment_label" prop:role="catalog-order-comment" prop:text=""></anvil-component>
  <div class="catalog-order-card__actions">
