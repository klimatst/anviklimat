<anvil-form layout="Minimal_Theme_4.Layouts.BaseLayout">
  <anvil-block slot="actions">
    <anvil-component type="Button" name="duplicate_button" prop:text="Дублировать в черновик" prop:role="secondary-button" prop:visible="false"></anvil-component>
    <anvil-component type="Button" name="delete_button" prop:text="Удалить товар" prop:role="secondary-button" prop:visible="false"></anvil-component>
    <anvil-component type="Button" name="back_button" prop:text="Назад в каталог" prop:role="secondary-button"></anvil-component>
  </anvil-block>
  <anvil-block slot="content">
    <div class="product-editor-view">
      <anvil-component type="ColumnPanel" name="product_form" prop:role="card">
        <anvil-component type="Label" name="product_status" prop:role="status-message" prop:text=""></anvil-component>
        <nav class="product-editor-tabs" aria-label="Разделы карточки товара">
          <anvil-component type="Button" name="basic_tab_button" prop:text="Основное" prop:role="product-editor-tab-active"></anvil-component>
          <anvil-component type="Button" name="pricing_tab_button" prop:text="Цена и наличие" prop:role="product-editor-tab"></anvil-component>
          <anvil-component type="Button" name="specs_tab_button" prop:text="Характеристики" prop:role="product-editor-tab" prop:visible="false"></anvil-component>
          <anvil-component type="Button" name="custom_fields_tab_button" prop:text="Дополнительные поля" prop:role="product-editor-tab" prop:visible="false"></anvil-component>
          <anvil-component type="Button" name="media_tab_button" prop:text="Изображения" prop:role="product-editor-tab" prop:visible="false"></anvil-component>
          <anvil-component type="Button" name="documents_tab_button" prop:text="Документы" prop:role="product-editor-tab" prop:visible="false"></anvil-component>
          <anvil-component type="Button" name="source_tab_button" prop:text="Источник" prop:role="product-editor-tab"></anvil-component>
        </nav>
        <anvil-component type="Label" name="product_tab_heading" prop:role="product-tab-heading" prop:text="Основные сведения"></anvil-component>

        <anvil-component type="ColumnPanel" name="product_basic_tab" prop:role="product-editor-section">
          <anvil-component type="Label" name="identity_heading" prop:role="section-heading" prop:text="Идентификация товара"></anvil-component>
          <anvil-component type="Label" name="brand_label" prop:text="Бренд"></anvil-component>
          <anvil-component type="TextBox" name="brand_box" prop:placeholder="Фактическое название бренда"></anvil-component>
          <anvil-component type="Label" name="model_label" prop:text="Модель (обязательно)"></anvil-component>
          <anvil-component type="TextBox" name="model_box" prop:placeholder="Модель по источнику"></anvil-component>
          <anvil-component type="Label" name="sku_label" prop:text="Артикул / SKU"></anvil-component>
          <anvil-component type="TextBox" name="sku_box" prop:placeholder="Артикул, если указан источником"></anvil-component>
          <anvil-component type="Label" name="category_label" prop:text="Категория"></anvil-component>
          <anvil-component type="DropDown" name="category_dropdown"></anvil-component>
          <anvil-component type="DropDown" name="subcategory_dropdown"></anvil-component>
          <anvil-component type="DropDown" name="series_dropdown"></anvil-component>
          <anvil-component type="Label" name="type_label" prop:text="Тип оборудования"></anvil-component>
          <anvil-component type="TextBox" name="type_box" prop:placeholder="Фактический тип оборудования"></anvil-component>
          <anvil-component type="Label" name="description_label" prop:text="Описание"></anvil-component>
          <anvil-component type="TextArea" name="description_box" prop:placeholder="Описание из проверенного источника"></anvil-component>
          <anvil-component type="CheckBox" name="active_checkbox" prop:text="Показывать товар в каталоге"></anvil-component>
        </anvil-component>

        <anvil-component type="ColumnPanel" name="product_pricing_tab" prop:role="product-editor-section" prop:visible="false">
          <anvil-component type="Label" name="pricing_heading" prop:role="section-heading" prop:text="Цена и наличие"></anvil-component>
          <div class="product-editor-field-grid">
            <anvil-component type="TextBox" name="purchase_price_box" prop:placeholder="Закупочная цена"></anvil-component>
            <anvil-component type="TextBox" name="sale_price_box" prop:placeholder="Цена продажи"></anvil-component>
            <anvil-component type="TextBox" name="special_price_box" prop:placeholder="Специальная цена"></anvil-component>
            <anvil-component type="TextBox" name="discount_box" prop:placeholder="Скидка, %"></anvil-component>
            <anvil-component type="TextBox" name="markup_box" prop:placeholder="Наценка, %"></anvil-component>
            <anvil-component type="TextBox" name="installation_price_box" prop:placeholder="Цена монтажа"></anvil-component>
            <anvil-component type="TextBox" name="quantity_box" prop:placeholder="Известный остаток"></anvil-component>
            <anvil-component type="TextBox" name="minimum_stock_box" prop:placeholder="Минимальный остаток"></anvil-component>
          </div>
        </anvil-component>

        <anvil-component type="ColumnPanel" name="product_source_tab" prop:role="product-editor-section" prop:visible="false">
          <anvil-component type="Label" name="source_heading" prop:role="section-heading" prop:text="Источник данных и фотографии"></anvil-component>
          <anvil-component type="Label" name="image_url_label" prop:text="Фотография товара · ссылка на реальное фото"></anvil-component>
          <anvil-component type="TextBox" name="image_url_box" prop:placeholder="HTTPS-ссылка на фото именно этой модели"></anvil-component>
          <anvil-component type="TextBox" name="source_url_box" prop:placeholder="URL источника (HTTP/HTTPS)"></anvil-component>
          <anvil-component type="TextBox" name="source_publisher_box" prop:placeholder="Издатель или поставщик данных"></anvil-component>
          <anvil-component type="TextBox" name="source_version_box" prop:placeholder="Версия источника"></anvil-component>
        </anvil-component>

        <anvil-component type="ColumnPanel" name="specs_panel" prop:role="product-editor-section" prop:visible="false">
          <anvil-component type="Label" name="specs_heading" prop:role="section-heading" prop:text="Редактируемые характеристики"></anvil-component>
          <anvil-component type="Label" name="spec_help" prop:role="status-message" prop:text="Каждая строка хранится отдельно: название, значение, единица, порядок и видимость."></anvil-component>
          <anvil-component type="RepeatingPanel" name="spec_rows" prop:item_template="Minimal_Theme_4.Catalog.SpecItem"></anvil-component>
          <div class="product-editor-field-grid">
            <anvil-component type="TextBox" name="spec_key_box" prop:placeholder="Название характеристики"></anvil-component>
            <anvil-component type="TextBox" name="spec_value_box" prop:placeholder="Фактическое значение"></anvil-component>
            <anvil-component type="TextBox" name="spec_unit_box" prop:placeholder="Единица измерения"></anvil-component>
            <anvil-component type="TextBox" name="spec_source_box" prop:placeholder="Источник характеристики"></anvil-component>
          </div>
          <anvil-component type="Button" name="add_spec_button" prop:text="Добавить характеристику" prop:role="secondary-button"></anvil-component>
          <anvil-component type="Label" name="spec_message" prop:role="status-message" prop:text=""></anvil-component>
        </anvil-component>

        <anvil-component type="ColumnPanel" name="custom_fields_panel" prop:role="product-editor-section" prop:visible="false">
          <anvil-component type="Label" name="custom_fields_product_heading" prop:role="section-heading" prop:text="Дополнительные поля категории"></anvil-component>
          <anvil-component type="Label" name="custom_fields_product_help" prop:role="status-message" prop:text="Типы и обязательность этих полей задаются в редакторе категории."></anvil-component>
          <anvil-component type="RepeatingPanel" name="custom_field_rows" prop:role="catalog-custom-field-list" prop:item_template="Minimal_Theme_4.Catalog.ProductEditor.CustomFieldItem"></anvil-component>
        </anvil-component>

        <anvil-component type="ColumnPanel" name="media_panel" prop:role="product-editor-section" prop:visible="false">
          <anvil-component type="Label" name="media_heading" prop:role="section-heading" prop:text="Изображения модели"></anvil-component>
          <anvil-component type="Label" name="media_help" prop:role="status-message" prop:text="Используйте только фотографии этой модели. До 20 изображений на товар, до 8 МБ каждое."></anvil-component>
          <anvil-component type="FileLoader" name="image_files" prop:text="Выбрать изображения" prop:file_types=".jpg,.jpeg,.png,.webp,.gif" prop:multiple="true"></anvil-component>
          <anvil-component type="Button" name="upload_images_button" prop:text="Загрузить изображения" prop:role="secondary-button"></anvil-component>
          <anvil-component type="Label" name="media_status" prop:role="status-message" prop:text=""></anvil-component>
          <anvil-component type="RepeatingPanel" name="media_rows" prop:role="product-media-gallery" prop:item_template="Minimal_Theme_4.Catalog.ProductEditor.MediaItem"></anvil-component>
        </anvil-component>

        <anvil-component type="ColumnPanel" name="document_panel" prop:role="product-editor-section" prop:visible="false">
          <anvil-component type="Label" name="documents_heading" prop:role="section-heading" prop:text="Документы и инструкции"></anvil-component>
          <anvil-component type="RepeatingPanel" name="document_rows" prop:role="catalog-document-list" prop:item_template="Minimal_Theme_4.Catalog.DocumentItem"></anvil-component>
          <div class="catalog-document-form">
            <anvil-component type="TextBox" name="document_title_box" prop:placeholder="Название документа"></anvil-component>
            <anvil-component type="DropDown" name="document_kind_dropdown"></anvil-component>
            <anvil-component type="FileLoader" name="document_file" prop:text="Загрузить PDF, DOCX или ZIP" prop:file_types=".pdf,.doc,.docx,.zip"></anvil-component>
            <anvil-component type="TextBox" name="document_url_box" prop:placeholder="Или безопасная ссылка"></anvil-component>
            <anvil-component type="TextBox" name="document_order_box" prop:placeholder="Порядок документа" prop:text="0"></anvil-component>
            <anvil-component type="Button" name="add_document_button" prop:text="Добавить документ" prop:role="secondary-button"></anvil-component>
          </div>
          <anvil-component type="Label" name="document_message" prop:role="status-message" prop:text=""></anvil-component>
        </anvil-component>

        <div class="product-editor-save-row">
          <anvil-component type="Label" name="product_save_hint" prop:role="status-message" prop:text="Проверьте карточку перед сохранением изменений."></anvil-component>
          <anvil-component type="Button" name="save_product_button" prop:text="Сохранить товар" prop:role="primary-action"></anvil-component>
        </div>
      </anvil-component>
    </div>
  </anvil-block>
  <anvil-block slot="title">
    <anvil-component type="Label" name="page_title" prop:role="h1" prop:text="Карточка товара"></anvil-component>
  </anvil-block>
</anvil-form>
