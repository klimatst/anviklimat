<anvil-form container="FlowPanel" prop:role="catalog-spec-editor-row">
  <anvil-component type="TextBox" name="key_box" prop:placeholder="Параметр"></anvil-component>
  <anvil-component type="TextBox" name="value_box" prop:placeholder="Значение"></anvil-component>
  <anvil-component type="TextBox" name="unit_box" prop:placeholder="Единица"></anvil-component>
  <anvil-component type="TextBox" name="source_box" prop:placeholder="Источник"></anvil-component>
  <anvil-component type="TextBox" name="order_box" prop:placeholder="Порядок"></anvil-component>
  <anvil-component type="CheckBox" name="visible_checkbox" prop:text="Показывать"></anvil-component>
  <anvil-component type="Button" name="save_button" prop:text="Сохранить строку" prop:role="secondary-button"></anvil-component>
  <anvil-component type="Button" name="delete_button" prop:text="Удалить" prop:role="danger-action"></anvil-component>
  <anvil-component type="Label" name="spec_status" prop:role="status-message" prop:text=""></anvil-component>
</anvil-form>
