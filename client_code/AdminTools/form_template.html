<anvil-form layout="Minimal_Theme_4.Layouts.BaseLayout">
  <anvil-block slot="actions">
    <anvil-component type="Button" name="refresh_button" prop:text="Обновить" prop:role="secondary-button"></anvil-component>
  </anvil-block>
  <anvil-block slot="title">
    <anvil-component type="Label" name="page_title" prop:role="h1" prop:text="Центр управления"></anvil-component>
  </anvil-block>
  <anvil-block slot="content">
    <div class="admin-os">
      <aside class="admin-os__sidebar">
        <div class="admin-os__brand">
          <span class="admin-os__brand-mark">K</span>
          <div>
            <strong>КЛИМАЭКО</strong>
            <small>ENGINEERING OS</small>
          </div>
        </div>
        <div class="admin-os__section-label">РАЗДЕЛЫ</div>
        <anvil-component type="Button" name="sidebar_all" prop:text="⌂  Обзор" prop:role="admin-sidebar-link admin-sidebar-link-active"></anvil-component>
        <anvil-component type="Button" name="sidebar_editors" prop:text="✦  Контент и дизайн" prop:role="admin-sidebar-link"></anvil-component>
        <anvil-component type="Button" name="sidebar_catalog" prop:text="▦  Каталог" prop:role="admin-sidebar-link"></anvil-component>
        <anvil-component type="Button" name="sidebar_engineering" prop:text="⌬  Инженерия" prop:role="admin-sidebar-link"></anvil-component>
        <anvil-component type="Button" name="sidebar_operations" prop:text="◌  Клиенты и CRM" prop:role="admin-sidebar-link"></anvil-component>
        <anvil-component type="Button" name="sidebar_system" prop:text="⌁  Система" prop:role="admin-sidebar-link"></anvil-component>
        <div class="admin-os__sidebar-foot">
          <span class="admin-os__live-dot"></span>
          <span>СИСТЕМА ГОТОВА</span>
        </div>
      </aside>

      <main class="admin-os__workspace">
        <section class="admin-os__topbar">
          <div>
            <anvil-component type="Label" name="admin_eyebrow" prop:role="eyebrow" prop:text="CONTROL CENTER · КЛИМАЭКО"></anvil-component>
            <anvil-component type="Label" name="admin_intro" prop:role="lede" prop:text="Единое рабочее пространство без тяжёлых Dashboard-виджетов."></anvil-component>
          </div>
          <div class="admin-os__status">
            <span>MODE</span>
            <strong>FAST WORKSPACE</strong>
          </div>
        </section>

        <section class="admin-os__engineering">
          <div>
            <anvil-component type="Label" name="engineering_eyebrow" prop:role="eyebrow" prop:text="ENGINEERING OS"></anvil-component>
            <anvil-component type="Label" name="engineering_heading" prop:role="section-heading" prop:text="Инженерный контур"></anvil-component>
            <anvil-component type="Label" name="engineering_status" prop:role="status-message" prop:text="Инженерный центр загружается только по запросу."></anvil-component>
          </div>
          <div class="admin-os__engineering-actions">
            <anvil-component type="Button" name="engineering_control_button" prop:text="Открыть Control Room →" prop:role="primary-action"></anvil-component>
          </div>
        </section>

        <section class="admin-os__toolbar">
          <div class="admin-os__toolbar-title">
            <anvil-component type="Label" name="module_eyebrow" prop:role="eyebrow" prop:text="WORKSPACE"></anvil-component>
            <anvil-component type="Label" name="module_heading" prop:role="section-heading" prop:text="Рабочие разделы"></anvil-component>
          </div>
          <div class="admin-os__toolbar-controls">
            <anvil-component type="TextBox" name="module_search_box" prop:role="admin-module-search" prop:placeholder="Поиск раздела…"></anvil-component>
            <anvil-component type="DropDown" name="module_group_dropdown" prop:visible="false"></anvil-component>
            <anvil-component type="Label" name="module_status" prop:role="status-message" prop:text=""></anvil-component>
          </div>
        </section>

        <anvil-component type="RepeatingPanel" name="module_rows" prop:role="admin-module-grid" prop:item_template="Minimal_Theme_4.AdminTools.ModuleCard"></anvil-component>

        <section class="admin-os__attention">
          <div>
            <anvil-component type="Label" name="health_eyebrow" prop:role="eyebrow" prop:text="СОСТОЯНИЕ"></anvil-component>
            <anvil-component type="Label" name="health_heading" prop:role="section-heading" prop:text="Быстрый контроль"></anvil-component>
          </div>
          <anvil-component type="Label" name="attention_summary" prop:role="admin-hub-attention-title" prop:text="Готово к работе"></anvil-component>
          <anvil-component type="Label" name="attention_detail" prop:role="status-message" prop:text="Глубокая диагностика, Quality Gate и расширенные показатели запускаются только из соответствующих разделов."></anvil-component>
        </section>
      </main>
    </div>
  </anvil-block>
</anvil-form>
