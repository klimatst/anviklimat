<anvil-form container="ColumnPanel" prop:role="admin-metric-card">
  <div class="admin-metric-card__signal"><span></span></div>
  <anvil-component type="Label" name="metric_value" prop:role="admin-metric-value" bind:text="self.item['value']"></anvil-component>
  <anvil-component type="Label" name="metric_label" prop:role="admin-metric-label" bind:text="self.item['label']"></anvil-component>
  <div class="admin-metric-card__footer">
    <span>LIVE DATA</span>
    <anvil-component type="Button" name="open_metric_button" prop:role="admin-metric-open" prop:text="Открыть →"></anvil-component>
  </div>
</anvil-form>
