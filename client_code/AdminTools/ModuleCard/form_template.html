<anvil-form container="ColumnPanel" prop:role="admin-module-card">
  <div class="admin-module-card__scanline"></div>
  <div class="admin-module-card__top">
    <div class="admin-module-card__identity">
      <span class="admin-module-card__index">MODULE</span>
      <anvil-component type="Label" name="module_icon" prop:role="admin-module-icon" bind:text="self.item['icon']"></anvil-component>
    </div>
    <anvil-component type="Label" name="module_badge" prop:role="admin-module-badge" bind:text="self.item['badge']"></anvil-component>
  </div>
  <anvil-component type="Label" name="module_title" prop:role="admin-module-title" bind:text="self.item['title']"></anvil-component>
  <anvil-component type="Label" name="module_description" prop:role="admin-module-description" bind:text="self.item['description']"></anvil-component>
  <div class="admin-module-card__rail"><span></span></div>
  <div class="admin-module-card__command">
    <span>WORKSPACE</span>
    <div class="admin-module-card__actions">
      <anvil-component type="Button" name="favorite_button" prop:role="admin-module-favorite" bind:text="self.item['favorite_label']"></anvil-component>
      <anvil-component type="Button" name="open_button" prop:role="admin-module-open" prop:text="Открыть →"></anvil-component>
    </div>
  </div>
</anvil-form>
