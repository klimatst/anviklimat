<anvil-form layout="Minimal_Theme_4.Layouts.BaseLayout">
  <anvil-block slot="actions">
    <anvil-component type="Button" name="save_plan_button" prop:text="Сохранить схему" prop:role="primary-action"></anvil-component>
    <anvil-component type="Button" name="back_button" prop:text="К проекту" prop:role="secondary-button"></anvil-component>
  </anvil-block>
  <anvil-block slot="content">
    <div class="digital-twin-view">
      <section class="digital-twin-hero">
        <div>
          <anvil-component type="Label" name="plan_eyebrow" prop:role="eyebrow" prop:text="ENGINEERING DIGITAL TWIN"></anvil-component>
          <anvil-component type="Label" name="plan_title" prop:role="h1" prop:text="План объекта"></anvil-component>
          <anvil-component type="Label" name="plan_subtitle" prop:role="service-copy" prop:text="Загрузите план дома, квартиры или здания и разместите инженерные элементы прямо на чертеже."></anvil-component>
        </div>
        <anvil-component type="Label" name="plan_status" prop:role="status-message" prop:text=""></anvil-component>
      </section>

      <div class="digital-twin-toolbar">
        <anvil-component type="FileLoader" name="plan_file_loader" prop:text="Загрузить план" prop:file_types=".png,.jpg,.jpeg,.webp,.pdf,.dwg,.dxf"></anvil-component>
        <anvil-component type="TextBox" name="plan_name_box" prop:placeholder="Название плана"></anvil-component>
        <anvil-component type="TextBox" name="scale_box" prop:placeholder="Масштаб: метров на пиксель"></anvil-component>
        <anvil-component type="Button" name="save_scale_button" prop:text="Применить масштаб" prop:role="secondary-button"></anvil-component>
        <anvil-component type="CheckBox" name="grid_checkbox" prop:text="Сетка"></anvil-component>
        <anvil-component type="CheckBox" name="snap_checkbox" prop:text="Привязка"></anvil-component>
        <anvil-component type="Button" name="zoom_out_button" prop:text="−" prop:role="secondary-button"></anvil-component>
        <anvil-component type="Label" name="zoom_label" prop:text="100%"></anvil-component>
        <anvil-component type="Button" name="zoom_in_button" prop:text="+" prop:role="secondary-button"></anvil-component>
      </div>

      <div class="digital-twin-workbench">
        <anvil-component type="ColumnPanel" name="plan_canvas_panel" prop:role="card">
          <anvil-component type="Canvas" name="plan_canvas" prop:width="1100" prop:height="680" prop:background="#0b1015" prop:foreground="#d7e1e7"></anvil-component>
        </anvil-component>

        <anvil-component type="ColumnPanel" name="plan_tools_panel" prop:role="card">
          <anvil-component type="Label" name="tools_heading" prop:role="section-heading" prop:text="Инженерная палитра"></anvil-component>
          <anvil-component type="DropDown" name="tool_dropdown"></anvil-component>
          <anvil-component type="TextBox" name="element_name_box" prop:placeholder="Название элемента"></anvil-component>
          <anvil-component type="DropDown" name="system_dropdown"></anvil-component>
          <anvil-component type="Button" name="clear_selection_button" prop:text="Снять выбор" prop:role="secondary-button"></anvil-component>
          <anvil-component type="Button" name="delete_selected_button" prop:text="Удалить выбранное" prop:role="secondary-button"></anvil-component>
          <anvil-component type="Label" name="tools_hint" prop:role="status-message" prop:text="Выберите инструмент и кликайте по плану. Для трассы — две точки."></anvil-component>

          <anvil-component type="Label" name="selection_heading" prop:role="section-heading" prop:text="Выбранный элемент"></anvil-component>
          <anvil-component type="Label" name="selection_label" prop:text="Ничего не выбрано"></anvil-component>
          <anvil-component type="TextBox" name="selected_length_box" prop:placeholder="Длина / значение"></anvil-component>
          <anvil-component type="Button" name="save_selected_button" prop:text="Сохранить параметры" prop:role="secondary-button"></anvil-component>

          <anvil-component type="Label" name="layers_heading" prop:role="section-heading" prop:text="Слои"></anvil-component>
          <anvil-component type="DropDown" name="layer_dropdown"></anvil-component>

          <anvil-component type="Label" name="stats_label" prop:role="status-message" prop:text=""></anvil-component>
        </anvil-component>
      </div>

      <div class="digital-twin-bottom">
        <anvil-component type="Label" name="workflow_label" prop:role="section-heading" prop:text="Объект → помещения → оборудование → трассы → расчёты → спецификация → монтаж"></anvil-component>
        <anvil-component type="Button" name="open_constructor_button" prop:text="Открыть инженерную схему" prop:role="secondary-button"></anvil-component>
        <anvil-component type="Button" name="open_calculations_button" prop:text="Расчёты объекта" prop:role="secondary-button"></anvil-component>
      </div>
    </div>
  </anvil-block>
  <anvil-block slot="title">
    <anvil-component type="Label" name="page_title" prop:role="h1" prop:text="Engineering Digital Twin"></anvil-component>
  </anvil-block>
</anvil-form>
