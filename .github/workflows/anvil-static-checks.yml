name: Anvil static checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check required Anvil theme asset
        shell: python
        run: |
          import pathlib, sys
          stylesheet = pathlib.Path('theme/theme.css')
          editor_config = pathlib.Path('.anvil_editor.yaml')
          if not stylesheet.is_file() or stylesheet.stat().st_size == 0:
              print('Missing required theme/theme.css referenced by Anvil editor configuration.')
              sys.exit(1)
          if not editor_config.is_file() or 'theme.css:' not in editor_config.read_text(encoding='utf-8'):
              print('Anvil editor configuration does not register theme.css.')
              sys.exit(1)
          print(f'Anvil theme asset present ({stylesheet.stat().st_size} bytes).')
      - name: Check server package requirements
        shell: python
        run: |
          import ast, pathlib, re, sys
          req = pathlib.Path('requirements.txt')
          if not req.is_file():
              print('Missing root requirements.txt; Anvil server packages must be declared at the app root.')
              sys.exit(1)
          declared = {re.split(r"[<=>!~\[]", line, maxsplit=1)[0].strip().lower() for line in req.read_text(encoding='utf-8').splitlines() if line.strip() and not line.lstrip().startswith('#')}
          imports = set()
          for path in pathlib.Path('server_code').rglob('*.py'):
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.update(alias.name.split('.')[0].lower() for alias in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      imports.add(node.module.split('.')[0].lower())
          if 'bcrypt' in imports and not any(name == 'bcrypt' or name.startswith('bcrypt[') for name in declared):
              print('server_code imports bcrypt but root requirements.txt does not declare it.')
              sys.exit(1)
          if 'bcrypt' in imports:
              print('bcrypt server dependency is declared in root requirements.txt.')
      - name: Compile Python sources
        shell: bash
        run: |
          python -m compileall -q client_code server_code
      - name: Check duplicate server definitions
        shell: python
        run: |
          import pathlib, ast, sys
          errors = []
          for path in pathlib.Path("server_code").rglob("*.py"):
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except SyntaxError as exc:
                  errors.append(f"{path}: {exc}")
                  continue
              names = {}
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      names.setdefault(node.name, []).append(node.lineno)
              for name, lines in names.items():
                  if len(lines) > 1:
                      errors.append(f"{path}: duplicate top-level {name}: {lines}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("Server syntax and duplicate-definition checks passed.")

      - name: Check client form component references
        shell: python
        run: |
          import ast, pathlib, re, sys
          root = pathlib.Path("client_code")
          ui_properties = {
              "text", "visible", "items", "enabled", "source", "selected_value",
              "checked", "role", "classes", "placeholder", "tooltip", "background",
              "foreground", "border", "bold", "italic", "html", "icon", "url",
              "height", "width", "spacing", "align", "hide_text", "format",
              "rows", "columns", "font_size", "spacing_above", "spacing_below",
              "read_only", "selected", "image", "enabled", "displayed", "expanded"
          }
          ignored = {
              "item", "parent", "tag", "role", "visible", "layout", "component",
              "form", "window", "session", "context", "data", "properties",
              "permissions", "settings", "project", "room", "system", "quote",
              "client", "task", "service", "estimate", "calculation", "formula"
          }
          layout = root / "Layouts" / "BaseLayout" / "form_template.html"
          inherited = set(re.findall(r'\b(?:name|anvil:name)="([^"]+)"', layout.read_text(encoding="utf-8"))) if layout.exists() else set()
          errors = []
          checked = 0
          for source in root.rglob("__init__.py"):
              template = source.with_name("form_template.html")
              if not template.exists():
                  continue
              names = inherited | set(re.findall(r'\b(?:name|anvil:name)="([^"]+)"', template.read_text(encoding="utf-8")))
              try:
                  tree = ast.parse(source.read_text(encoding="utf-8"), filename=str(source))
              except SyntaxError:
                  continue
              checked += 1
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Attribute) or node.attr not in ui_properties:
                      continue
                  base = node.value
                  if not (isinstance(base, ast.Attribute) and isinstance(base.value, ast.Name) and base.value.id == "self"):
                      continue
                  component = base.attr
                  if component.startswith("_") or component in ignored or component in names:
                      continue
                  errors.append(f"{source}:{node.lineno}: self.{component}.{node.attr} not found in form_template.html")
          if errors:
              print("\n".join(errors[:200]))
              print(f"Potential missing UI components: {len(errors)} across {checked} forms.")
              sys.exit(1)
          print(f"Form component reference check passed across {checked} forms.")
      - name: Check client/server callable contract
        shell: python
        run: |
          import ast, pathlib, sys
          server_callables = set()
          client_calls = {}
          for path in pathlib.Path("server_code").rglob("*.py"):
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except SyntaxError:
                  continue
              for node in tree.body:
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  for decorator in node.decorator_list:
                      if isinstance(decorator, ast.Attribute) and decorator.attr == "callable":
                          server_callables.add(node.name)
                      elif isinstance(decorator, ast.Call) and isinstance(decorator.func, ast.Attribute) and decorator.func.attr == "callable":
                          server_callables.add(node.name)
          for path in pathlib.Path("client_code").rglob("*.py"):
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except SyntaxError:
                  continue
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call) or not node.args:
                      continue
                  func = node.func
                  if not (isinstance(func, ast.Attribute) and func.attr == "call"):
                      continue
                  if not (isinstance(func.value, ast.Attribute) and func.value.attr == "server"):
                      continue
                  if not (isinstance(func.value.value, ast.Name) and func.value.value.id == "anvil"):
                      continue
                  name = node.args[0]
                  if isinstance(name, ast.Constant) and isinstance(name.value, str):
                      client_calls.setdefault(name.value, set()).add(str(path))
          missing = sorted(name for name in client_calls if name not in server_callables)
          if missing:
              for name in missing:
                  print(f"Missing server callable: {name} <- {sorted(client_calls[name])}")
              sys.exit(1)
          print(f"Client/server callable contract passed: {len(client_calls)} static calls checked.")
