name: Sync Hisense catalog photos

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - theme/assets/catalog/hisense/photo_sources.json
      - server_code/HisenseLovableCatalogData.py
      - shared_hosting_php/data/hisense_catalog.json
      - .github/workflows/sync-hisense-images.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image processor
        shell: bash
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download and optimize catalog photos
        shell: python
        run: |
          import json
          import pathlib
          import shutil
          import urllib.request
          from collections import deque
          from io import BytesIO
          from PIL import Image

          sources = json.loads(pathlib.Path(
              "theme/assets/catalog/hisense/photo_sources.json"
          ).read_text(encoding="utf-8"))
          target = pathlib.Path("theme/assets/catalog/hisense")
          target.mkdir(parents=True, exist_ok=True)
          php_target = pathlib.Path("shared_hosting_php/assets/images/hisense")
          php_target.mkdir(parents=True, exist_ok=True)

          def remove_connected_white(img):
              rgba = img.convert("RGBA")
              pixels = rgba.load()
              width, height = rgba.size
              visited = bytearray(width * height)
              queue = deque()

              def enqueue(x, y):
                  index = y * width + x
                  if visited[index]:
                      return
                  visited[index] = 1
                  queue.append((x, y))

              for x in range(width):
                  enqueue(x, 0)
                  enqueue(x, height - 1)
              for y in range(height):
                  enqueue(0, y)
                  enqueue(width - 1, y)

              removed = 0
              while queue:
                  x, y = queue.popleft()
                  r, g, b, a = pixels[x, y]
                  near_white = r >= 242 and g >= 242 and b >= 242 and max(r, g, b) - min(r, g, b) <= 14
                  if near_white:
                      pixels[x, y] = (255, 255, 255, 0)
                      removed += 1
                      for nx, ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                          if 0 <= nx < width and 0 <= ny < height:
                              enqueue(nx, ny)
              return rgba

          for key, url in sources.items():
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "klimatst-anviklimat-hisense-sync/2.0"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      data = response.read()
              except Exception as error:
                  print(f"WARNING: {key} image unavailable ({url}): {error}; will use a local fallback")
                  continue
              if len(data) < 100:
                  print(f"WARNING: {key} image is unexpectedly small; will use a local fallback")
                  continue

              image = Image.open(BytesIO(data))
              image.load()
              image.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
              image = remove_connected_white(image)

              output = target / f"{key}.png"
              image.save(
                  output,
                  "PNG",
                  optimize=True,
                  compress_level=9,
                )
              if output.stat().st_size < 100:
                  raise RuntimeError(f"{key}: processed image is unexpectedly small")
              php_output = php_target / output.name
              shutil.copyfile(output, php_output)
              if php_output.stat().st_size != output.stat().st_size:
                  raise RuntimeError(f"{key}: PHP package image copy is incomplete")

          available = [
              path for path in php_target.glob("*.png")
              if path.is_file() and path.stat().st_size >= 100
          ]
          if not available:
              raise RuntimeError("No usable Hisense images downloaded; cannot create safe fallbacks")
          fallback = next(
              (php_target / f"{key}.png" for key in ("vibe", "sensation", "vision", "city", "accessory")
               if (php_target / f"{key}.png").is_file() and (php_target / f"{key}.png").stat().st_size >= 100),
              available[0],
          )
          for key in sources:
              for folder in (target, php_target):
                  output = folder / f"{key}.png"
                  if not output.is_file() or output.stat().st_size < 100:
                      shutil.copyfile(fallback, output)
                      print(f"WARNING: {key} uses fallback artwork from {fallback.name}")

      - name: Commit GitHub photo assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Another concurrent Codex merge may advance master while images are downloading.
          # Rebase the generated assets onto the latest master before committing.
          git fetch origin master
          git reset --hard origin/master
          git add theme/assets/catalog/hisense/*.png shared_hosting_php/assets/images/hisense/*.png
          if git diff --cached --quiet; then
            echo "No photo changes"
            exit 0
          fi
          git commit -m "Optimize Hisense catalog photos"

          for attempt in 1 2 3; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Master moved during photo sync; retrying push ($attempt/3)"
            sleep 2
          done
          echo "Unable to push optimized photo assets after three retries."
          exit 1
