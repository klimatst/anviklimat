<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101a20">
  <title>KlimaEco — нет подключения</title>

    main{max-width:520px;padding:28px;border:1px solid #2a3b42;border-radius:18px;background:#101a20}

    p{color:#a9babd}
    button{border:0;border-radius:9px;background:#a4f0dc;color:#081411;font-weight:800;padding:12px 16px}
  </style>
</head>
<body>
  <main>
    <div class="mark">KLIMAECO / ENGINEERING</div>
    <h1>Нет подключения к сети</h1>
    <p>Проверьте интернет и повторите попытку. Админка, каталог и расчёты доступны после восстановления соединения.</p>
    <button onclick="location.reload()">Повторить</button>
  </main>
</body>
</html>
